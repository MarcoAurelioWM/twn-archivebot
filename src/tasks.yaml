# Task Scheduler for User:ArchiveBot on translatewiki.net
---
- name: archive
  image: python3.13
  command: ./bot/src/archive.sh
  filelog-stdout: logs/archive.log
  filelog-stderr: logs/archive.log
  schedule: "@daily"
  emails: onfailure
- name: clear-cache
  image: python3.13
  command: ./bot/src/clear-cache.sh
  filelog-stderr: logs/cache.log
  filelog-stdout: logs/cache.log
  schedule: "45 23 * * *"
  emails: onfailure
- name: logrotate
  image: mariadb
  command: ./bot/src/logrotate.sh
  filelog-stderr: logs/logrotate.log
  filelog-stdout: logs/logrotate.log
  schedule: "@weekly"
  emails: onfailure
- name: logout
  image: python3.13
  command: ./bot/src/login.sh
  filelog-stderr: logs/login.log
  filelog-stdout: logs/login.log
  schedule: "50 23 * * *"
  emails: onfailure
